<svg width="680" height="560" viewBox="0 0 680 560" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Esquema Firestore — La Rose Escala Online</title>
<desc>Coleções do Firestore: escalas, historico, configuracoes com seus documentos e campos.</desc>

<rect width="680" height="560" fill="#f8fafc"/>

<!-- Root -->
<rect x="240" y="16" width="200" height="44" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="0.5"/>
<text x="340" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="600" fill="#064e3b">Firestore</text>
<text x="340" y="52" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#047857">4 coleções raiz</text>

<!-- Branch lines -->
<line x1="340" y1="60" x2="340" y2="88" stroke="#94a3b8" stroke-width="1"/>
<line x1="90" y1="88" x2="590" y2="88" stroke="#94a3b8" stroke-width="1"/>
<line x1="90"  y1="88" x2="90"  y2="108" stroke="#94a3b8" stroke-width="1"/>
<line x1="260" y1="88" x2="260" y2="108" stroke="#94a3b8" stroke-width="1"/>
<line x1="430" y1="88" x2="430" y2="108" stroke="#94a3b8" stroke-width="1"/>
<line x1="590" y1="88" x2="590" y2="108" stroke="#94a3b8" stroke-width="1"/>

<!-- Collection: escalas -->
<rect x="20" y="108" width="140" height="50" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.5"/>
<text x="90" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">escalas_loja1</text>
<text x="90" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1d4ed8">escalas_loja2</text>

<!-- Collection: historico -->
<rect x="190" y="108" width="140" height="50" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.5"/>
<text x="260" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#78350f">historico_loja1</text>
<text x="260" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#92400e">historico_loja2</text>

<!-- Collection: configuracoes -->
<rect x="360" y="108" width="140" height="50" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.5"/>
<text x="430" y="127" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#4c1d95">configuracoes</text>
<text x="430" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6d28d9">funcs · turnos</text>

<!-- Collection: future -->
<rect x="530" y="108" width="130" height="50" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.5"/>
<text x="595" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" fill="#64748b">(extensível)</text>

<!-- escalas → doc -->
<line x1="90" y1="158" x2="90" y2="186" stroke="#3b82f6" stroke-width="1"/>
<rect x="20" y="186" width="140" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.5"/>
<text x="90" y="204" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">doc: {YYYY-MM}</text>
<text x="90" y="221" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#3b82f6">ex: 2026-09</text>

<!-- doc → fields -->
<line x1="90" y1="230" x2="90" y2="258" stroke="#3b82f6" stroke-width="1"/>
<rect x="20" y="258" width="140" height="110" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.5"/>
<text x="90" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">campos</text>
<text x="32" y="296" font-family="system-ui,monospace,sans-serif" font-size="11" fill="#1d4ed8">days: {1..31}</text>
<text x="32" y="313" font-family="system-ui,monospace,sans-serif" font-size="11" fill="#1d4ed8">published: bool</text>
<text x="32" y="330" font-family="system-ui,monospace,sans-serif" font-size="11" fill="#1d4ed8">updatedAt: string</text>
<text x="32" y="347" font-family="system-ui,monospace,sans-serif" font-size="11" fill="#1d4ed8">year / month: int</text>

<!-- days → structure -->
<line x1="160" y1="276" x2="192" y2="276" stroke="#3b82f6" stroke-width="1" marker-end="url(#ar2)"/>
<defs>
<marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<marker id="ar4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="192" y="248" width="175" height="118" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="0.5"/>
<text x="280" y="267" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#1e3a8a">days[d] — por dia</text>
<text x="204" y="287" font-family="system-ui,monospace,sans-serif" font-size="11" fill="#1d4ed8">shifts: [{key,time}]</text>
<text x="204" y="305" font-family="system-ui,monospace,sans-serif" font-size="11" fill="#1d4ed8">folgam: [key]</text>
<text x="204" y="323" font-family="system-ui,monospace,sans-serif" font-size="11" fill="#1d4ed8">ausencias: [{key,tipo}]</text>
<text x="204" y="341" font-family="system-ui,monospace,sans-serif" font-size="11" fill="#1d4ed8">type / label (feriado)</text>

<!-- historico → doc -->
<line x1="260" y1="158" x2="260" y2="186" stroke="#f59e0b" stroke-width="1"/>
<rect x="192" y="186" width="140" height="58" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="0.5"/>
<text x="262" y="205" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#78350f">doc: {auto-id}</text>
<text x="204" y="225" font-family="system-ui,monospace,sans-serif" font-size="11" fill="#92400e">ts · before · after · type</text>

<!-- configuracoes → docs -->
<line x1="430" y1="158" x2="430" y2="186" stroke="#7c3aed" stroke-width="1"/>
<line x1="390" y1="186" x2="540" y2="186" stroke="#7c3aed" stroke-width="1"/>
<line x1="390" y1="186" x2="390" y2="206" stroke="#7c3aed" stroke-width="1"/>
<line x1="540" y1="186" x2="540" y2="206" stroke="#7c3aed" stroke-width="1"/>

<rect x="330" y="206" width="122" height="58" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.5"/>
<text x="391" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#4c1d95">config_loja1/2</text>
<text x="342" y="245" font-family="system-ui,monospace,sans-serif" font-size="10" fill="#6d28d9">funcionarios: [{…}]</text>
<text x="342" y="258" font-family="system-ui,monospace,sans-serif" font-size="10" fill="#6d28d9">key,label,bg,text,border</text>

<rect x="472" y="206" width="122" height="58" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="0.5"/>
<text x="533" y="225" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#4c1d95">turnos_loja1/2</text>
<text x="484" y="245" font-family="system-ui,monospace,sans-serif" font-size="10" fill="#6d28d9">turnos: [{…}]</text>
<text x="484" y="258" font-family="system-ui,monospace,sans-serif" font-size="10" fill="#6d28d9">label, value (HH:MM)</text>

<!-- Legend box -->
<rect x="20" y="406" width="640" height="136" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="6 4"/>
<text x="40" y="426" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#64748b">LEGENDA DAS CHAVES</text>

<rect x="40" y="436" width="110" height="26" rx="5" fill="#d1fae5" stroke="#10b981" stroke-width="0.5"/>
<text x="95" y="453" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#064e3b">key: ID do func.</text>
<text x="162" y="453" font-family="system-ui,sans-serif" font-size="11" fill="#475569">ex: "amanda", "italo", "gardenia"</text>

<rect x="40" y="470" width="110" height="26" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="0.5"/>
<text x="95" y="487" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#78350f">tipo: ausência</text>
<text x="162" y="487" font-family="system-ui,sans-serif" font-size="11" fill="#475569">"atestado" | "ferias" | "licenca" | "falta" | "folga_ex"</text>

<rect x="40" y="504" width="110" height="26" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.5"/>
<text x="95" y="521" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="500" fill="#1e3a8a">time: horário</text>
<text x="162" y="521" font-family="system-ui,sans-serif" font-size="11" fill="#475569">ex: "08:00–16:20" (traço em meia)</text>

</svg>
