<svg width="680" height="600" viewBox="0 0 680 600" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Fluxo do La Rose Escala Online</title>
<desc>Dois fluxos paralelos: colaborador (esquerda) e admin (direita), partindo da seleção de loja.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect width="680" height="600" fill="#f8fafc"/>

<!-- Entry -->
<rect x="230" y="20" width="220" height="44" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5"/>
<text x="340" y="46" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1e293b">Acessa larose-escala.web.app</text>

<!-- Loja select -->
<rect x="240" y="96" width="200" height="44" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="0.5"/>
<text x="340" y="118" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#064e3b">Seleciona a loja</text>
<text x="340" y="133" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#047857">Entre Lagos · Itapoã Parque</text>

<line x1="340" y1="64" x2="340" y2="96" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Fork lines -->
<line x1="240" y1="118" x2="148" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440" y1="118" x2="534" y2="170" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="168" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Colaborador</text>
<text x="512" y="158" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#64748b">Admin</text>

<!-- COLABORADOR FLOW -->
<rect x="48" y="174" width="200" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.5"/>
<text x="148" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1e3a8a">Ver calendário do mês</text>
<text x="148" y="211" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1d4ed8">turnos · folgas · feriados</text>

<line x1="148" y1="218" x2="148" y2="254" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="48" y="254" width="200" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.5"/>
<text x="148" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1e3a8a">Filtrar por funcionário</text>
<text x="148" y="291" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1d4ed8">turnos · folgas · dias livres</text>

<line x1="148" y1="298" x2="148" y2="334" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="48" y="334" width="200" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.5"/>
<text x="148" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1e3a8a">Tap para expandir dia</text>
<text x="148" y="371" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#1d4ed8">nome completo + horário</text>

<line x1="148" y1="378" x2="148" y2="414" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="48" y="414" width="200" height="44" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="0.5"/>
<text x="148" y="441" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#1e3a8a">Exportar PDF</text>

<!-- ADMIN FLOW -->
<rect x="434" y="174" width="200" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.5"/>
<text x="534" y="196" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#4c1d95">Login (e-mail + senha)</text>
<text x="534" y="211" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6d28d9">Firebase Authentication</text>

<line x1="534" y1="218" x2="534" y2="254" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="434" y="254" width="200" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.5"/>
<text x="534" y="276" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#4c1d95">Painel admin</text>
<text x="534" y="291" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6d28d9">escala · sidebar · drag &amp; drop</text>

<line x1="534" y1="298" x2="534" y2="334" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="434" y="334" width="200" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.5"/>
<text x="534" y="356" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#4c1d95">Montar escala</text>
<text x="534" y="371" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#6d28d9">turnos · folgas · ausências</text>

<line x1="534" y1="378" x2="534" y2="414" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="434" y="414" width="200" height="44" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="0.5"/>
<text x="534" y="441" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#4c1d95">Publicar escala</text>

<line x1="534" y1="458" x2="534" y2="502" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Published -->
<rect x="340" y="502" width="260" height="44" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="0.5"/>
<text x="470" y="529" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#064e3b">Escala visível para colaboradores</text>

<!-- Feedback loop -->
<line x1="340" y1="524" x2="248" y2="524" stroke="#10b981" stroke-width="1.5"/>
<line x1="248" y1="524" x2="248" y2="200" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="290" y="518" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10" fill="#047857">atualiza automaticamente</text>

</svg>
